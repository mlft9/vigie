[package]
name = "vigie"
description = "Client SSH / SFTP / RDP de bureau"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "vigie_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = ["isolation"] }

[dependencies]
# `isolation` : modèle d'isolation de l'IPC (ADR-015).
tauri = { version = "2.12.6", features = ["isolation"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
tracing-appender = "0.2.5"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
