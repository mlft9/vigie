[package]
name = "core-vault"
description = "Coffre chiffré de Younji : format de fichier, chiffrement, modèle de données (sans dépendance à Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4.3"
secrecy = { version = "0.10.3", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true
tracing.workspace = true
uuid = { version = "1.29.3", features = ["v4", "serde"] }
zeroize = "1.9"
zxcvbn = { version = "3.1.1", default-features = false }

[lints]
workspace = true
