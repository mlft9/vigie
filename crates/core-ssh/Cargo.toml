[package]
name = "core-ssh"
description = "Client SSH de Younji : connexion, authentification, PTY distant, clés d'hôte (sans dépendance à Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa"] }
secrecy = { version = "0.10.3", features = ["serde"] }
tempfile = "3"
thiserror.workspace = true
tokio = { version = "1.54", features = ["rt", "net", "time", "sync", "macros"] }
tokio-util = "0.7.20"
tracing.workspace = true
zeroize = "1.9"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "test-util"] }
