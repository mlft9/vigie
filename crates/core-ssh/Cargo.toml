[package]
name = "core-ssh"
description = "Client SSH de Younji : connexion, authentification, PTY distant, clés d'hôte (sans dépendance à Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Générateur du système pour la génération de clés (KEY-01) ; `sys_rng` expose `SysRng`.
getrandom = { version = "0.4.3", features = ["sys_rng"] }
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa"] }
# Protocole SFTP v3 (SFTP-01 à 05) ; Apache-2.0. Travaille sur un flux (canal russh).
russh-sftp = { version = "3.0.1", default-features = false }
secrecy = { version = "0.10.3", features = ["serde"] }
tempfile = "3"
thiserror.workspace = true
tokio = { version = "1.54", features = ["rt", "net", "time", "sync", "macros", "fs", "io-util"] }
tokio-util = "0.7.20"
tracing.workspace = true
zeroize = "1.9"

[lints]
workspace = true

[dev-dependencies]
rand = "0.10"
tokio = { version = "1.54", features = ["rt-multi-thread", "test-util"] }
