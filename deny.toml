# Configuration cargo-deny (SECURITE.md §8, ADR-009).
# Vérifie : avis de sécurité RustSec, licences compatibles GPL-3.0, sources des crates, doublons.

[graph]
# Plateformes réellement visées : Windows et Linux x64 (CAHIER_DES_CHARGES §2.1).
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
version = 2
# Les crates non maintenues (dépendances directes et transitives) ou retirées (yanked)
# sont des erreurs.
unmaintained = "all"
yanked = "deny"
# Toute exception est justifiée ici et réexaminée à chaque mise à jour de Tauri.
ignore = [
    # proc-macro-error n'est plus maintenue. Dépendance de compilation uniquement (macros de
    # gtk-rs, chaîne Linux de Tauri) : aucun code embarqué dans l'application. Pas d'alternative
    # tant que Tauri dépend de gtk-rs 0.18.
    { id = "RUSTSEC-2024-0370", reason = "macro de compilation transitive de gtk-rs (Tauri), non maintenue, sans code à l'exécution" },
    # chrono n'est plus maintenue (avis « unmaintained », aucune vulnérabilité connue).
    # Dépendance de russh-sftp 3.0.1, qui ne s'en sert que pour fabriquer des attributs côté
    # serveur (`protocol::File::longname`, `FileAttributes::from(&Metadata)`) : chemins jamais
    # appelés par le client de Younji (étape 4, ADR-034). À retirer dès que russh-sftp
    # remplace chrono ; à réexaminer à chaque mise à jour de russh-sftp.
    { id = "RUSTSEC-2026-0543", reason = "chrono non maintenue, transitive de russh-sftp, code jamais appelé côté client" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# La liste blanche suit .claude/rules/ci.md : certaines licences ne sont pas encore utilisées.
unused-allowed-license = "allow"
# Licences permissives ou à copyleft faible, toutes compatibles avec la GPL-3.0.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "GPL-3.0-only",
]

[licenses.private]
# Nos propres crates (publish = false) ne sont pas vérifiées comme des dépendances.
ignore = true

[bans]
# Les doublons de versions sont fréquents dans l'arbre de Tauri : signalés, non bloquants.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Uniquement crates.io : aucune dépendance depuis un dépôt Git ou un registre tiers.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
