# Configuration cargo-deny (SECURITE.md §8, ADR-009).
# Vérifie : avis de sécurité RustSec, licences compatibles GPL-3.0, sources des crates, doublons.

[graph]
# Plateformes réellement visées : Windows et Linux x64 (CAHIER_DES_CHARGES §2.1).
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
version = 2
# Les crates non maintenues ou retirées (yanked) sont signalées comme des erreurs.
unmaintained = "workspace"
yanked = "deny"
# Toute exception doit être justifiée ici, avec une date d'expiration.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# La liste blanche suit .claude/rules/ci.md : certaines licences ne sont pas encore utilisées.
unused-allowed-license = "allow"
# Licences permissives ou à copyleft faible, toutes compatibles avec la GPL-3.0.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "GPL-3.0-only",
]

[licenses.private]
# Nos propres crates (publish = false) ne sont pas vérifiées comme des dépendances.
ignore = true

[bans]
# Les doublons de versions sont fréquents dans l'arbre de Tauri : signalés, non bloquants.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Uniquement crates.io : aucune dépendance depuis un dépôt Git ou un registre tiers.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
