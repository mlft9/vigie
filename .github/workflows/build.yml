# Compilation des installeurs Windows et Linux, uniquement à la demande ou sur tag (ADR-008).
# Chaque installeur est publié comme artefact individuel, non zippé, téléchargeable directement
# depuis la page du run (pas de release GitHub à ce stade).
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Installeurs ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
            # Un fichier par entrée : chacun est publié sans archive (voir les étapes d'envoi).
            installer_1: target/release/bundle/nsis/*-setup.exe
            installer_2: target/release/bundle/msi/*.msi
          - name: Linux
            # Ubuntu 22.04 : paquets compatibles avec les glibc plus anciennes.
            os: ubuntu-22.04
            bundles: deb,appimage
            installer_1: target/release/bundle/deb/*.deb
            installer_2: target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dépendances système de Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libxdo-dev \
            patchelf file
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Aucun script d'installation npm n'est exécuté (chaîne d'approvisionnement, menace M4).
      - run: npm ci --ignore-scripts
      # Compilation directe avec la CLI Tauri : pas d'action tierce supplémentaire, aucun secret.
      # --locked impose les versions de Cargo.lock. La valeur de la matrice passe par env:
      # (jamais d'expression interpolée directement dans un script) ; bash sur les deux systèmes.
      - name: Compiler les installeurs
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: npx tauri build --ci --bundles "$BUNDLES" -- --locked
      # archive: false publie l'installeur tel quel (pas de .zip) ; l'artefact porte alors le nom
      # du fichier. Cette option n'accepte qu'un fichier par envoi, d'où deux étapes.
      - name: Publier le premier installeur
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ matrix.installer_1 }}
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Publier le second installeur
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ matrix.installer_2 }}
          archive: false
          if-no-files-found: error
          retention-days: 14
